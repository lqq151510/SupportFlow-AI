name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Confirm Docker is available for Testcontainers
        run: docker info
      - run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Confirm Docker is available for Testcontainers
        run: docker info
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.8'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync dependencies (uv.lock is authoritative)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Pytest with coverage
        run: |
          uv run pytest -q --cov=supportflow --cov-report=term --cov-report=json:coverage.json
      - name: Enforce coverage gates (AGENTS.md section 9)
        run: |
          uv run python - <<'PY'
          import json, sys
          totals = json.loads(open("coverage.json").read())["totals"]
          line_pct = 100 * totals["covered_lines"] / totals["num_statements"]
          branch_pct = (
              100 * totals["covered_branches"] / totals["num_branches"]
              if totals["num_branches"]
              else 100.0
          )
          print(f"line {line_pct:.2f}% (gate 85), branch {branch_pct:.2f}% (gate 75)")
          failures = [
              gate
              for gate, actual, floor in (("line", line_pct, 85), ("branch", branch_pct, 75))
              if actual < floor
          ]
          sys.exit(f"coverage gate failed: {failures}") if failures else None
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - name: Start backend
        env:
          SUPPORTFLOW_MODEL_MOCK_ENABLED: 'true'
        run: |
          MODEL_SECRET_MASTER_KEY="$(openssl rand -base64 32)" \
            mvn -B -f ../backend/pom.xml spring-boot:run \
            -Dspring-boot.run.arguments=--server.port=18080 > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid
      - name: Wait for backend
        run: |
          backend_pid=$(cat ../backend-e2e.pid)
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat ../backend-e2e.log
              exit 1
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - run: npm run test:e2e
        env:
          SUPPORTFLOW_API_BASE_URL: http://localhost:18080
          VITE_API_BASE_URL: http://localhost:18080
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      - name: Stop backend
        if: always()
        run: |
          if test -f ../backend-e2e.pid; then
            kill "$(cat ../backend-e2e.pid)" 2>/dev/null || true
          fi

  desktop-macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin
      - name: Build Apple Silicon DMG
        run: npm run build:dmg -- --target aarch64-apple-darwin
      - name: Verify disk image integrity
        run: hdiutil verify src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: supportflow-macos-dmg
          path: frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.language == 'javascript-typescript'
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: github/codeql-action/analyze@v4
