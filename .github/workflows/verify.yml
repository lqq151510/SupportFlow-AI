name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: mvn -B -f ../backend/pom.xml spring-boot:run -Dspring-boot.run.arguments=--server.port=18080 > ../backend-e2e.log 2>&1 &
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - run: npm run test:e2e
        env:
          SUPPORTFLOW_API_BASE_URL: http://localhost:18080
          VITE_API_BASE_URL: http://localhost:18080
          PLAYWRIGHT_BASE_URL: http://localhost:5173

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.language == 'javascript-typescript'
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: github/codeql-action/analyze@v4
