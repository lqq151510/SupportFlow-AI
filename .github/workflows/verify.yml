name: Verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: mvn -B -f ../backend/pom.xml spring-boot:run -Dspring-boot.run.arguments=--server.port=18080 > ../backend-e2e.log 2>&1 &
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - run: npm run test:e2e
        env:
          SUPPORTFLOW_API_BASE_URL: http://localhost:18080
          PLAYWRIGHT_BASE_URL: http://localhost:5173
