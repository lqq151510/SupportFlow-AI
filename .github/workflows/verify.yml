name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - name: Start backend
        env:
          SUPPORTFLOW_MODEL_MOCK_ENABLED: 'true'
        run: |
          MODEL_SECRET_MASTER_KEY="$(openssl rand -base64 32)" \
            mvn -B -f ../backend/pom.xml spring-boot:run \
            -Dspring-boot.run.arguments=--server.port=18080 > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid
      - name: Wait for backend
        run: |
          backend_pid=$(cat ../backend-e2e.pid)
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat ../backend-e2e.log
              exit 1
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - run: npm run test:e2e
        env:
          SUPPORTFLOW_API_BASE_URL: http://localhost:18080
          VITE_API_BASE_URL: http://localhost:18080
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      - name: Stop backend
        if: always()
        run: |
          if test -f ../backend-e2e.pid; then
            kill "$(cat ../backend-e2e.pid)" 2>/dev/null || true
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.language == 'javascript-typescript'
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: github/codeql-action/analyze@v4
