name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Confirm Docker is available for Testcontainers
        run: docker info
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - name: Start backend
        env:
          SUPPORTFLOW_MODEL_MOCK_ENABLED: 'true'
        run: |
          MODEL_SECRET_MASTER_KEY="$(openssl rand -base64 32)" \
            mvn -B -f ../backend/pom.xml spring-boot:run \
            -Dspring-boot.run.arguments=--server.port=18080 > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid
      - name: Wait for backend
        run: |
          backend_pid=$(cat ../backend-e2e.pid)
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat ../backend-e2e.log
              exit 1
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - run: npm run test:e2e
        env:
          SUPPORTFLOW_API_BASE_URL: http://localhost:18080
          VITE_API_BASE_URL: http://localhost:18080
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      - name: Stop backend
        if: always()
        run: |
          if test -f ../backend-e2e.pid; then
            kill "$(cat ../backend-e2e.pid)" 2>/dev/null || true
          fi

  desktop-macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin
      - name: Build Apple Silicon DMG
        run: npm run build:dmg -- --target aarch64-apple-darwin
      - name: Verify disk image integrity
        run: hdiutil verify src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: supportflow-macos-dmg
          path: frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build Windows MSI and NSIS installers
        run: npm run build:windows
      - name: Verify Windows installer artifacts
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi")
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)" }
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)" }
          if ($msi[0].Length -le 0 -or $nsis[0].Length -le 0) { throw "Installer artifact is empty" }
          Get-FileHash $msi[0].FullName -Algorithm SHA256
          Get-FileHash $nsis[0].FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: supportflow-windows-installers
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.language == 'javascript-typescript'
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: github/codeql-action/analyze@v4
