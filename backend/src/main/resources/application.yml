spring:
  application:
    name: supportflow-backend
  datasource:
    url: jdbc:h2:mem:supportflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

supportflow:
  model:
    mock:
      enabled: false
  storage:
    minio:
      enabled: false
  search:
    elasticsearch:
      enabled: false
  knowledge:
    search:
      minimum-rrf-score: 0.015
    retrieval:
      minimum-score: 0.0
      minimum-citations: 1
  generation:
    redis:
      enabled: false
      ttl: PT10M
  eventing:
    dispatch:
      initial-delay: PT30S
      fixed-delay: PT30S
    rocketmq:
      enabled: false
      nameserver: ${ROCKETMQ_NAMESERVER:localhost:9876}
      topic: support-domain-events
      consumer-group: supportflow-event-consumer
      max-reconsume-times: 8
  ticket:
    sla:
      initial-delay: PT1M
      fixed-delay: PT1M
  jwt:
    # 本地测试默认值；Docker 和真实环境必须通过 SUPPORTFLOW_JWT_SECRET_BASE64 覆盖。
    secret-base64: ${SUPPORTFLOW_JWT_SECRET_BASE64:c3VwcG9ydGZsb3ctbG9jYWwtb25seS1zaWduaW5nLWtleS0zMmJ5dGVzLQ==}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D

server:
  shutdown: graceful

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    # PDFBox 解析 Type3 字体时会逐字形打印告警并附带完整堆栈（单次上传可达数千行），
    # 会冲掉后端日志缓冲并掩盖真实错误。该告警仅影响字形宽度推断，不影响文本抽取结果。
    # 必须用 OFF：logback 没有 FATAL 级别，写 FATAL 会被静默降级为 DEBUG。
    org.apache.pdfbox: OFF
