spring:
  application:
    name: supportflow-backend
  datasource:
    url: jdbc:h2:mem:supportflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

supportflow:
  storage:
    minio:
      enabled: false
  search:
    elasticsearch:
      enabled: false
  generation:
    redis:
      enabled: false
      ttl: PT10M
  eventing:
    dispatch:
      initial-delay: PT30S
      fixed-delay: PT30S
    rocketmq:
      enabled: false
      nameserver: ${ROCKETMQ_NAMESERVER:localhost:9876}
      topic: support.domain.events
  ticket:
    sla:
      initial-delay: PT1M
      fixed-delay: PT1M
  jwt:
    # 本地测试默认值；Docker 和真实环境必须通过 SUPPORTFLOW_JWT_SECRET_BASE64 覆盖。
    secret-base64: ${SUPPORTFLOW_JWT_SECRET_BASE64:c3VwcG9ydGZsb3ctbG9jYWwtb25seS1zaWduaW5nLWtleS0zMmJ5dGVzLQ==}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
