name: supportflow

# Python 重构后的编排：运行时只依赖 PostgreSQL（含 pgvector）。
# 旧 Java 版的 MySQL / Redis / Elasticsearch / MinIO / RocketMQ 已按
# docs/adr/0008 退役，在阶段 5 之前旧版本可从归档目录恢复演示。
#
# 启动顺序由依赖条件保证：postgres 健康 → migrate 建表 → seed 预置演示账号
# → api 与 worker 并行启动。数据落在命名卷 postgres-data，容器重启后保留。

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportflow}
      POSTGRES_USER: ${POSTGRES_USER:-supportflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportflow} -d ${POSTGRES_DB:-supportflow}"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: &app_build
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportflow}:${POSTGRES_PASSWORD:-supportflow}@postgres:5432/${POSTGRES_DB:-supportflow}
      MODEL_MODE: ${MODEL_MODE:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: *app_build
    command: ["python", "-m", "supportflow.bootstrap.seed"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *app_build
    command:
      - uvicorn
      - supportflow.bootstrap.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *app_env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build: *app_build
    command: ["python", "-m", "supportflow.bootstrap.worker"]
    environment: *app_env
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
