[project]
name = "supportflow"
version = "0.1.0"
description = "SupportFlow Agent · 智能客服工单助手"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=23.1.0",
    "jieba>=0.42.1",
    "pgvector>=0.5.0",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "testcontainers[postgres]>=4.8.0",
]

# 依赖索引在项目内显式固定。
#
# 本机 `uv lock` 记录的下载源会在 pypi.org 与第三方镜像之间漂移：实测**两次相同输入**
# 分别产出了两种源，进而在提交里引入上千行与改动无关的 URL 改写。这里把默认索引钉住，
# 并由 tests/unit/test_lockfile_registry.py 断言锁文件只使用该索引，使漂移无法无声发生。
# 需要本地加速时请用环境变量覆盖（如 `UV_DEFAULT_INDEX=...`），不要改动本文件。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实 PostgreSQL（Testcontainers 或本地实例）",
]

[tool.coverage.run]
branch = true
source = ["supportflow"]
# 纯接口声明文件不参与覆盖率统计：它们只含 Protocol 方法（`...`），
# 其「方法体 → exit」的隐式分支是测量噪声，不是可测逻辑。
# 含运行时实现（dataclass、as_state 等）的 agent/application/ports.py 保留测量。
omit = [
    "src/supportflow/approval/domain/ports.py",
    "src/supportflow/agent/domain/ports.py",
    "src/supportflow/evaluation/domain/ports.py",
    "src/supportflow/identity/domain/ports.py",
    "src/supportflow/knowledge/domain/ports.py",
    "src/supportflow/model/domain/ports.py",
    "src/supportflow/ticket/domain/ports.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol 方法体是声明（`...`），不是可测逻辑 —— 排除后分支统计才反映真实业务分支。
    '^\s*\.\.\.\s*$',
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI 的 Depends()/Query() 必须写在默认值位置
    "RUF001", # 代码库以中文注释与文档为主，全角标点是有意为之
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^migrations/"]
